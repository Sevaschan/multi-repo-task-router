name: Bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - multi-repo-task-router-source.tar.xz

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source tree
        run: |
          if [ ! -f multi-repo-task-router-source.tar.xz ]; then
            exit 0
          fi
          tar -xJf multi-repo-task-router-source.tar.xz
          rm multi-repo-task-router-source.tar.xz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Multi-Repo Task Router source"
          git push
