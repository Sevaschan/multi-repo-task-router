name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build packages
        run: npm run package
      - name: Validate
        run: npm test
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Multi-Repo Task Router 1.0.0
          body_path: .github/release-notes-v1.0.0.md
          files: |
            dist/multi-repo-task-router-1.0.0.ipollowork-plugin
            dist/multi-repo-task-router-1.0.0-skill.zip
            dist/multi-repo-task-router-1.0.0-source.zip
            dist/SHA256SUMS.txt
